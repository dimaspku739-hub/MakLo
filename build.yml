name: Build APK

# Trigger di setiap push ke branch manapun (bot push ke branch build-<jobId>)
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip build otomatis untuk branch deploy web (gh-pages-*), itu bukan project Flutter
    if: ${{ !startsWith(github.ref_name, 'gh-pages-') }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: Show Flutter info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # Nama branch dari bot: build-<jobId>-release atau build-<jobId>-debug
      - name: Determine build type from branch name
        id: buildtype
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-debug" ]]; then
            echo "type=debug" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (release)
        if: steps.buildtype.outputs.type == 'release'
        run: flutter build apk --release

      - name: Build APK (debug)
        if: steps.buildtype.outputs.type == 'debug'
        run: flutter build apk --debug

      - name: Collect APK into a clean folder
        shell: bash
        run: |
          mkdir -p release-output
          if [ "${{ steps.buildtype.outputs.type }}" = "debug" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk release-output/app-release.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk release-output/app-release.apk
          fi

      # Nama artifact WAJIB "release-apk" -- ini yang dicari oleh bot Telegram
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release-output/app-release.apk
          retention-days: 1
